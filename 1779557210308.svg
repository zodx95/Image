<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 网页标准纯白背景 -->
  <rect width="100" height="100" fill="#FFFFFF" />

  <!-- 
    10px 极细锋刃主体 (旋转 90° 的 Z)
    小黑盒同款高级碳灰配色，沉稳且极具工业质感
    外围严格遵循上下左右各 16px 的等距留白
  -->
  <path d="
    M 16 16 
    L 74 45 
    L 74 16 
    L 84 21 
    L 84 84 
    L 26 55 
    L 26 84 
    L 16 79 
    Z" 
    fill="#383838" 
  />
  
  <!-- 
    精准 10px 负空间平行镂空斜槽
    填充颜色改为纯白，与背景融为一体，实现物理级无损切割
  -->
  <polygon points="
    26,32.41 
    74,56.41 
    74,67.59 
    26,43.59" 
    fill="#FFFFFF" 
  />
</svg>
