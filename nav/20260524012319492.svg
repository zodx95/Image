<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 网页标准纯粹暗黑背景 -->
  <rect width="100" height="100" fill="#0F1012" />

  <!-- 
    10px 极细锋刃主体 (旋转 90° 的 Z)
    所有切角与对角线保持绝对 0.5 斜率平行
    外围严格遵循上下左右各 16px 的等距留白
  -->
  <path d="
    M 16 16 
    L 74 45 
    L 74 16 
    L 84 21 
    L 84 84 
    L 26 55 
    L 26 84 
    L 16 79 
    Z" 
    fill="#FFFFFF" 
  />
  
  <!-- 
    精准 10px 负空间平行镂空斜槽
    坐标级切除，完美防范任何浏览器的渲染毛边
  -->
  <polygon points="
    26,32.41 
    74,56.41 
    74,67.59 
    26,43.59" 
    fill="#0F1012" 
  />
</svg>
